syntax = "proto3";
package sentinel.audit.v1;
option go_package = "github.com/thisaruRasanjana/Sentinel/audit-sink/pkg/auditv1";

service AuditService {
  rpc RecordEvent(AuditEvent) returns (AuditAck);
}

message AuditEvent {
  string event_id       = 1;   // UUID, generated by the Gateway
  string timestamp      = 2;   // RFC 3339 string, e.g. "2026-10-13T06:00:00Z"
  string agent_id       = 3;   // from JWT sub, e.g. "agent:invoice-assistant"
  string principal      = 4;   // from JWT principal, e.g. "user:thisaru"
  string tool_id        = 5;   // e.g. "invoice.create"
  int32  status_code    = 6;   // HTTP status code returned to the caller, e.g. 201, 401, 429
  string outcome        = 7;   // one of: "SUCCESS", "AUTH_FAILURE", "POLICY_DENIED", "UPSTREAM_ERROR", "REGISTRY_ERROR"
  int64  latency_ms     = 8;   // total gateway processing time in milliseconds
  string trace_id       = 9;   // the trace_id from the error envelope, or a new UUID for successes
}

message AuditAck {
  bool   accepted       = 1;
  string chain_hash     = 2;   // SHA-256 hex of the entry just written (includes prev_hash)
}
